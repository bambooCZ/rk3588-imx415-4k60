# DKMS: rebuilds imx415_60fps for every kernel installed with its headers.
# Which kernels are acceptable is the .deb's business (Depends on Armbian's
# vendor-rk35xx packages before 26.11, i.e. before the rk-6.1-rkr7.2 kernel).
PACKAGE_NAME="imx415-60fps"
PACKAGE_VERSION="1.0.0"
BUILT_MODULE_NAME[0]="imx415_60fps"
BUILT_MODULE_LOCATION[0]="build/drivers/media/i2c/"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir} module"
CLEAN="make clean"
AUTOINSTALL="yes"
